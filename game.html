<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinese Nouns Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<dialog id="idiom-animation" aria-labelledby="idiom-animation-title">
  <div class="idiom-animation-header">
    <h2 id="idiom-animation-title" lang="zh"></h2>
    <form method="dialog"><button class="btn btn-ghost" autofocus>Close</button></form>
  </div>
  <figure class="idiom-comic">
    <div class="idiom-animation-frame"></div>
    <figcaption lang="zh"></figcaption>
  </figure>
</dialog>
<p id="score-announcement" class="sr-only" role="status"></p>
<script src="/socket.io/socket.io.js" defer></script>
<script src="/gsap.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
